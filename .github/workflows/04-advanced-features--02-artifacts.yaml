name: Artifacts
on:
  workflow_dispatch:

jobs:
  artifact-producer:
    name: Produce artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Create artifact file
        run: |
          echo "This will be stored as an artifact!\n" > artifact.log
          echo "Generated by artifact-producer job on $(date)\n" >> artifact.log
          echo "This is test log file I created" >> artifact.log

      - name: Upload artifact
        uses: actions/upload-artifact@v7 # latest
        with:
          name: example-artifact
          path: artifact.log

  artifact-consumer:
    name: Consume artifact
    runs-on: ubuntu-24.04
    needs: artifact-producer
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8 # latest
        with:
          name: example-artifact

      - name: Cat artifact file
        run: cat artifact.log
